name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.12"
          cache: true
      - name: Verify version and test
        run: |
          ./scripts/verify-version.sh
          make test
      - name: Build release binaries
        run: |
          mkdir -p dist
          build_date="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          commit="${GITHUB_SHA}"
          ldflags="-s -w -X ecs/version.Commit=${commit} -X ecs/version.BuildDate=${build_date}"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "${ldflags}" -o dist/ecs-linux-amd64 ./cmd/ecs
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "${ldflags}" -o dist/ecs-linux-arm64 ./cmd/ecs
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "${ldflags}" -o dist/ecs-windows-amd64.exe ./cmd/ecs
          git archive --format=tar --prefix="ECS-${GITHUB_REF_NAME}/" HEAD | gzip -9 > "dist/ECS-source-${GITHUB_REF_NAME}.tar.gz"
          (cd dist && sha256sum ecs-* ECS-source-* > SHA256SUMS)
      - name: Create repository release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "ECS ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
